<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>连接设置 · 镜像洞察</title><style>
:root{--ink:#182320;--muted:#63716d;--line:#dce6e1;--paper:#f8fbf9;--accent:#156c52}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif}main{width:min(720px,calc(100% - 32px));margin:48px auto}.back{color:var(--accent);text-decoration:none;font-size:14px}h1{letter-spacing:-.04em;margin:18px 0 10px}.lead{color:var(--muted);line-height:1.65}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:25px;margin-top:25px}h2{font-size:19px;margin:0 0 8px}p{line-height:1.6}.hint{color:var(--muted);font-size:14px}label{display:block;font-size:14px;font-weight:700;margin:20px 0 7px}textarea,input{display:block;width:100%;border:1px solid var(--line);border-radius:10px;padding:12px;font:inherit;resize:vertical}.actions{display:flex;gap:10px;margin-top:20px}button{border:0;border-radius:10px;padding:12px 16px;font:inherit;font-weight:700;cursor:pointer}.save{background:var(--accent);color:white}.remove{background:#f2f5f3;color:#40504a}.state{margin-top:17px;padding:12px;border-radius:10px;background:#edf8f1;color:#17633f;font-size:14px}.state.empty{background:#fff9e9;color:#6c5927}.security{border-left:3px solid #e6b64e;padding:10px 13px;background:#fff9e9;color:#6c5927;font-size:13px;margin-top:22px;line-height:1.55}
</style></head><body><main><a class="back" href="index.html">← 返回分析工作台</a><h1>连接设置</h1><p class="lead">参照 SocialScript 的模式，凭据只保存在当前浏览器的本地存储中。点击分析时，才由网页把所需凭据发送给你配置的服务端。</p><section class="card"><h2>硅基流动 API</h2><p class="hint">用于视频转写、内容归纳和爆款分析。请填入硅基流动控制台创建的 API Key。</p><label for="api">API Key</label><input id="api" type="password" autocomplete="off" placeholder="sk-..."/><h2 style="margin-top:28px">平台 Cookie</h2><p class="hint">粘贴完整的 Cookie 请求头内容，或从 Cookie Editor 导出的 JSON。按平台分别保存，解析时自动匹配。</p><label for="xhs">小红书 Cookie</label><textarea id="xhs" rows="4" placeholder="a1=...; web_session=..."></textarea><label for="douyin">抖音 Cookie</label><textarea id="douyin" rows="4" placeholder="sessionid_ss=...; passport_csrf_token=..."></textarea><div class="actions"><button class="save" id="save">保存到此浏览器</button><button class="remove" id="remove">删除所有本地凭据</button></div><div class="state empty" id="state">尚未保存配置</div><p class="security">请仅在你自己的受信设备上粘贴 Cookie。浏览器本地存储不是加密保险箱；不要在公共电脑、共享浏览器或不受信的公网网站中保存。生产版应改用登录账户和服务端加密凭据库。</p></section></main><script>
const keys={api:'ci.siliconflowApiKey',xhs:'ci.xhsCookie',douyin:'ci.douyinCookie'};const $=x=>document.getElementById(x);function status(){const filled=Object.entries(keys).filter(([,k])=>localStorage.getItem(k)).map(([n])=>n==='api'?'API Key':n==='xhs'?'小红书 Cookie':'抖音 Cookie');$('state').textContent=filled.length?'已保存：'+filled.join('、'):'尚未保存配置';$('state').className='state '+(filled.length?'':'empty')}for(const [id,key] of Object.entries(keys))$(id).value=localStorage.getItem(key)||'';$('save').onclick=()=>{for(const [id,key] of Object.entries(keys)){const v=$(id).value.trim();if(v)localStorage.setItem(key,v);else localStorage.removeItem(key)}status()};$('remove').onclick=()=>{if(confirm('删除此浏览器保存的全部 API Key 和 Cookie？')){Object.values(keys).forEach(k=>localStorage.removeItem(k));for(const id of Object.keys(keys))$(id).value='';status()}};status();
</script><script src="settings-link.js"></script></body></html>
